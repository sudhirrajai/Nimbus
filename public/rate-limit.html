<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rate Limit Exceeded - Nimbus</title>
    
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,900" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #0f1015;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .card {
            background: #181920;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            padding: 3rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #eb1466, #ff758c);
            z-index: -1;
            border-radius: 1.6rem;
            opacity: 0.3;
        }
        
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(235, 20, 102, 0.12);
            color: #eb1466;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon-box span {
            font-size: 2.75rem;
        }
        
        h1 {
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
        }
        
        p {
            color: #9aa0ac;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        
        .countdown-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            margin-bottom: 1.75rem;
        }

        .countdown-number {
            font-size: 2.25rem;
            font-weight: 800;
            color: #eb1466;
            font-family: monospace;
            line-height: 1;
        }

        .countdown-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-top: 0.25rem;
        }

        .btn-retry {
            background: linear-gradient(135deg, #eb1466, #d01157);
            color: #fff;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-retry:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .footer-text {
            font-size: 0.75rem;
            color: #555;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">
            <span class="material-symbols-rounded">speed</span>
        </div>
        
        <h1>Too Many Requests</h1>
        
        <p>
            To protect this panel against automated attacks and excessive requests, temporary rate limiting has been engaged.
        </p>
        
        <div class="countdown-box">
            <div class="countdown-number" id="countdown">60</div>
            <div class="countdown-label">Seconds remaining before retry</div>
        </div>
        
        <div>
            <button id="retryBtn" class="btn-retry" disabled onclick="window.location.href='/login'">
                Retry Sign In
            </button>
        </div>
        
        <div class="footer-text">
            Protected by Nimbus Shield &copy; <span id="year"></span>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        let timeLeft = 60;
        const countdownEl = document.getElementById('countdown');
        const retryBtn = document.getElementById('retryBtn');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.textContent = '0';
                countdownEl.style.color = '#10b981';
                retryBtn.disabled = false;
                retryBtn.textContent = 'Retry Sign In Now';
            } else {
                countdownEl.textContent = timeLeft;
            }
        }, 1000);
    </script>
</body>
</html>
