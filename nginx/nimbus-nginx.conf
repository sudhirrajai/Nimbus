user www-data;
worker_processes auto;
pid /run/nimbus-nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /usr/local/nimbus/storage/logs/nginx_access.log;
    error_log /usr/local/nimbus/storage/logs/nginx_error.log;

    sendfile on;
    keepalive_timeout 65;

    # Security: Hide Nginx server version
    server_tokens off;

    # Rate limiting zone for authentication endpoints (10 requests/minute per IP)
    limit_req_zone $binary_remote_addr zone=nimbus_login:10m rate=10r/m;
    limit_req_status 429;
    
    server {
        listen 2095 ssl default_server;
        listen [::]:2095 ssl default_server;
        server_name _;

        # Auto-redirect plain HTTP to HTTPS on port 2095
        error_page 497 301 https://$host:2095$request_uri;

        ssl_certificate /usr/local/nimbus/ssl/nimbus.crt;
        ssl_certificate_key /usr/local/nimbus/ssl/nimbus.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/local/nimbus/public;
        index index.php index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 100M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/nimbus-php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        # Rate-limited login endpoints to prevent brute-force attacks
        location = /login {
            limit_req zone=nimbus_login burst=5 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /api/v1/auth/login {
            limit_req zone=nimbus_login burst=5 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Deny access to sensitive files
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
